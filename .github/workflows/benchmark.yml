name: Formula benchmark

on:
  workflow_dispatch:
  push:
    branches: [codex/formula-benchmark]
    paths:
      - 'benchmarks/**'
      - 'testdata/llar/benchmark/**'
      - '.github/workflows/benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Check native Linux and KVM
        run: |
          uname -a
          lscpu
          test -c /dev/kvm
          ls -l /dev/kvm
          docker info
      - name: Build common payload and toolchain image
        id: build
        run: docker build -f benchmarks/Dockerfile -t sandbox-formula-bench:ci .
      - name: Prepare Firecracker wrapper and identical root filesystem
        run: sudo bash benchmarks/setup-firecracker.sh sandbox-formula-bench:ci /tmp/firecracker-benchmark
      - name: Run Firecracker Formula benchmarks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p results/firecracker
          sudo python3 benchmarks/run.py --image sandbox-formula-bench:ci --output "$PWD/results/firecracker" --backends firecracker --firecracker-assets /tmp/firecracker-benchmark --concurrency 1,2,4,8 --builds 8 | tee results/firecracker/summary.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-benchmark-firecracker-amd64
          path: results/firecracker/
      - name: Run Docker Formula benchmarks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p results/docker
          sudo python3 benchmarks/run.py --image sandbox-formula-bench:ci --output "$PWD/results/docker" --backends docker --concurrency 1,2,4,8 --builds 8 | tee results/docker/summary.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-benchmark-docker-amd64
          path: results/docker/
      - name: Run sandbox Formula benchmarks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p results/sandbox
          sudo python3 benchmarks/run.py --image sandbox-formula-bench:ci --output "$PWD/results/sandbox" --backends sandbox --concurrency 1,2,4,8 --builds 8 | tee results/sandbox/summary.jsonl
      - name: Save exact guest kernel and VMM identities
        if: always()
        run: |
          mkdir -p results
          if test -f /tmp/firecracker-benchmark/kernel.json; then cp /tmp/firecracker-benchmark/kernel.json results/; fi
          if test -f /tmp/firecracker-benchmark/checksums.txt; then cp /tmp/firecracker-benchmark/checksums.txt results/; fi
          for backend in firecracker docker sandbox; do
            if test -f "results/$backend/environment.json"; then python3 benchmarks/report.py "results/$backend" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-benchmark-amd64
          path: results/
